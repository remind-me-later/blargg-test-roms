name: ROMs

# Builds the test ROMs with RGBDS and checks that they are, byte for byte, the
# ones of the gameboy-test-roms release and the ones in this repository.

on:
  push:
  pull_request:

env:
  RGBDS_VERSION: v1.0.4
  TEST_ROMS_VERSION: v7.0

jobs:
  roms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RGBDS
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rgbds.tar.xz" \
            "https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          mkdir "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          echo "$RUNNER_TEMP/rgbds" >> "$GITHUB_PATH"

      - name: Download the gameboy-test-roms release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/roms.zip" \
            "https://github.com/c-sp/gameboy-test-roms/releases/download/${TEST_ROMS_VERSION}/game-boy-test-roms-${TEST_ROMS_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/roms.zip" 'blargg/*' -d "$RUNNER_TEMP/roms"

      - name: Build and compare with the release
        run: |
          rgbasm --version
          ./build.sh --check "$RUNNER_TEMP/roms/blargg"

      - name: Build and compare with the ROMs of the repository
        run: ./build.sh --check
