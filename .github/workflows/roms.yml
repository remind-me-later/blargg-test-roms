name: ROMs

# Builds the test ROMs with RGBDS and checks that they are, byte for byte, the
# ones of the gameboy-test-roms release (pinned in fetch-reference.sh).

on:
  push:
  pull_request:

env:
  RGBDS_VERSION: v1.0.4
  # The tools always run with -Weverything: a warning fails the build here.
  RGBASMFLAGS: -Werror
  RGBLINKFLAGS: -Werror
  RGBFIXFLAGS: -Werror

jobs:
  roms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install RGBDS
        run: |
          curl -fsSL -o "$RUNNER_TEMP/rgbds.tar.xz" \
            "https://github.com/gbdev/rgbds/releases/download/${RGBDS_VERSION}/rgbds-linux-x86_64.tar.xz"
          mkdir "$RUNNER_TEMP/rgbds"
          tar -xJf "$RUNNER_TEMP/rgbds.tar.xz" -C "$RUNNER_TEMP/rgbds"
          echo "$RUNNER_TEMP/rgbds" >> "$GITHUB_PATH"

      - name: Download the gameboy-test-roms release
        run: ./fetch-reference.sh

      - name: Build and compare with the release
        run: |
          rgbasm --version
          ./build.sh --check
